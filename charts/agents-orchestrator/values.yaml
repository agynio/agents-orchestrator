nameOverride: ""
fullnameOverride: "agents-orchestrator"

global:
  imageRegistry: ""
  imagePullSecrets: []

image:
  registry: ""
  repository: ghcr.io/agynio/agents-orchestrator
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

replicaCount: 2
revisionHistoryLimit: 10
updateStrategy: {}

deploymentAnnotations: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

automountServiceAccountToken: true

rbac:
  create: true
  clusterWide: false
  rules:
    - apiGroups: ["coordination.k8s.io"]
      resources: ["leases"]
      verbs: ["get", "create", "update"]

podAnnotations: {}
podLabels: {}

podSecurityContext:
  enabled: false
  fsGroup: null

securityContext:
  enabled: true
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

priorityClassName: ""
terminationGracePeriodSeconds: null

service:
  enabled: false
  type: ClusterIP
  annotations: {}
  labels: {}
  ports: []

containerPorts: []

command: []
args: []
env:
  - name: THREADS_ADDRESS
    value: "threads:50051"
  - name: NOTIFICATIONS_ADDRESS
    value: "notifications:50051"
  - name: AGENTS_ADDRESS
    value: "agents:50051"
  - name: SECRETS_ADDRESS
    value: "secrets:50051"
  - name: RUNNERS_ADDRESS
    value: "runners:50051"
  - name: METERING_SERVICE_ADDRESS
    value: ""
  - name: METERING_SAMPLE_INTERVAL
    value: "60s"
  - name: ZITI_ENABLED
    value: "false"
  - name: ZITI_LEASE_RENEWAL_INTERVAL
    value: "2m"
  - name: ZITI_ENROLLMENT_TIMEOUT
    value: "2m"
  - name: ZITI_SIDECAR_IMAGE
    value: "openziti/ziti-tunnel:1.6.15"
  - name: ZITI_MANAGEMENT_ADDRESS
    value: "ziti-management:50051"
  - name: GROUP_SYNC_ENABLED
    value: "false"
  - name: GROUPS_ADDRESS
    value: "groups:50051"
  - name: NATS_URL
    value: ""
  # Upstream DNS resolver used by the workload Ziti tunnel after enrollment.
  - name: WORKLOAD_DNS_UPSTREAM
    value: ""
  # Bootstrap resolver used before the workload Ziti tunnel is running.
  - name: ZITI_ENROLLMENT_DNS_UPSTREAM
    value: ""
  # Cluster DNS name that ziti.agyn.dev should resolve to during enrollment.
  - name: ZITI_ENROLLMENT_CONTROLLER_RESOLVE_HOST
    value: "ziti-controller-client.ziti.svc.cluster.local"
  # Enrollment controller port used before the workload Ziti tunnel is running.
  - name: ZITI_ENROLLMENT_CONTROLLER_PORT
    value: "2496"
  # Cluster DNS name that ziti.agyn.dev should resolve to for sidecar auth.
  - name: ZITI_RUNTIME_CONTROLLER_RESOLVE_HOST
    value: "ziti-controller-client.ziti.svc.cluster.local"
  # Runtime controller port for the enrolled identity.
  - name: ZITI_RUNTIME_CONTROLLER_PORT
    value: "2496"
  # Deprecated: use WORKLOAD_DNS_UPSTREAM instead.
  - name: CLUSTER_DNS
    value: ""
  # Leave workload-facing addresses empty so config.go selects coherent
  # Ziti service names when ZITI_ENABLED=true and cluster names otherwise.
  - name: AGENT_GATEWAY_ADDRESS
    value: ""
  - name: AGENT_TRACING_ADDRESS
    value: ""
  - name: SANDBOX_INIT_IMAGE
    value: "ghcr.io/agynio/agent-init-codex:latest"
  - name: SANDBOX_WORKSPACE_SIZE_GB
    value: "10"
  - name: POLL_INTERVAL
    value: "5s"
  - name: IDLE_TIMEOUT
    value: "30s"
  - name: STOP_TIMEOUT_SEC
    value: ""
  - name: LEASE_NAME
    value: ""
  - name: EGRESS_CA_NAMESPACE
    value: ""
envFrom: []
extraEnvVars: []
extraEnvVarsCM: ""
extraEnvVarsSecret: ""

configMounts: []
extraVolumeMounts: []
extraVolumes: []

initContainers: []
extraContainers: []

lifecycle: {}

livenessProbe:
  enabled: false

readinessProbe:
  enabled: false

startupProbe:
  enabled: false

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: null
  metrics: []
  behavior: {}

pdb:
  enabled: false
  minAvailable: null
  maxUnavailable: null

ingress:
  enabled: false
  ingressClassName: ""
  annotations: {}
  hosts: []
  tls: []

metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: ""
    scrapeTimeout: ""
    honorLabels: false
    labels: {}
    annotations: {}
    relabelings: []
    metricRelabelings: []
    endpoints: []

egressCA:
  namespace: ""
  secretName: egress-ca
  rbac:
    create: true
