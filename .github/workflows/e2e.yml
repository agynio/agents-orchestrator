name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_ref:
        description: Bootstrap ref to provision from.
        required: false
        default: e9e44b4c083bf989a664e73000ac8d9e7fda2afe
      k8s_runner_ref:
        description: k8s-runner ref to deploy from.
        required: false
        default: 974d1792c4caa2855c08e01b71fe0ec537c2a0e4

env:
  BOOTSTRAP_REF: e9e44b4c083bf989a664e73000ac8d9e7fda2afe
  K8S_RUNNER_REF: 974d1792c4caa2855c08e01b71fe0ec537c2a0e4

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@main
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_ref || env.BOOTSTRAP_REF }}

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Checkout k8s-runner
        uses: actions/checkout@v4
        with:
          repository: agynio/k8s-runner
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.k8s_runner_ref || env.K8S_RUNNER_REF }}
          path: .e2e-deps/k8s-runner

      - name: Deploy k8s-runner from source
        working-directory: .e2e-deps/k8s-runner
        run: devspace run deploy

      - name: Deploy orchestrator from source
        run: devspace run deploy

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        env:
          E2E_SUITES: go-core playwright-chat-app
        with:
          service: agents_orchestrator
          include_smoke: "false"

      - name: Restore k8s-runner ArgoCD sync
        if: always()
        working-directory: .e2e-deps/k8s-runner
        run: devspace run restore-argocd

      - name: Restore ArgoCD sync
        if: always()
        run: devspace run restore-argocd
