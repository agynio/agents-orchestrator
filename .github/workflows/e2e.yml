name: E2E

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  AGN_INIT_IMAGE: ghcr.io/agynio/agent-init-agn:latest
  CODEX_INIT_IMAGE: ghcr.io/agynio/agent-init-codex:latest
  CLAUDE_INIT_IMAGE: ghcr.io/agynio/agent-init-claude:0.1.23
  AGN_EXPOSE_INIT_IMAGE: ghcr.io/agynio/agent-init-agn:latest
  AGYN_AGENT_INIT_IMAGE: ghcr.io/agynio/agent-init:v1.0.0

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout service
        uses: actions/checkout@v4
        with:
          path: service

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@main

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Checkout runners
        uses: actions/checkout@v4
        with:
          repository: agynio/runners
          ref: main
          path: runners

      - name: Deploy runners from source
        working-directory: runners
        run: devspace run deploy -n platform

      - name: Checkout expose
        uses: actions/checkout@v4
        with:
          repository: agynio/expose
          ref: main
          path: expose

      - name: Deploy expose from source
        working-directory: expose
        run: |
          set -euo pipefail
          image="ghcr.io/agynio/expose:e2e-main"
          docker build -t "$image" .
          k3d image import "$image" -c agyn-local
          if kubectl get application expose -n argocd >/dev/null 2>&1; then
            kubectl patch application expose -n argocd \
              --type merge \
              -p '{"spec":{"syncPolicy":{"automated":null}}}'
          fi
          deployment=$(kubectl get deployment -n platform -l app.kubernetes.io/name=expose -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$deployment" ]; then
            deployment="expose"
          fi
          container=$(kubectl get deployment "$deployment" -n platform -o jsonpath='{.spec.template.spec.containers[0].name}')
          kubectl set image deployment/"$deployment" -n platform "$container=$image"
          kubectl rollout status deployment/"$deployment" -n platform --timeout=600s

      - name: Checkout chat-app
        uses: actions/checkout@v4
        with:
          repository: agynio/chat-app
          ref: main
          path: chat-app

      - name: Deploy chat-app from source
        working-directory: chat-app
        env:
          CI: "true"
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
          devspace run dev -n platform

      - name: Checkout tracing-app
        uses: actions/checkout@v4
        with:
          repository: agynio/tracing-app
          ref: main
          path: tracing-app

      - name: Deploy tracing-app from source
        working-directory: tracing-app
        env:
          CI: "true"
        run: devspace run dev -n platform

      - name: Deploy orchestrator from source
        working-directory: service
        run: devspace run deploy -n platform

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        env:
          AGN_INIT_IMAGE: ${{ env.AGN_INIT_IMAGE }}
          CODEX_INIT_IMAGE: ${{ env.CODEX_INIT_IMAGE }}
          CLAUDE_INIT_IMAGE: ${{ env.CLAUDE_INIT_IMAGE }}
          AGN_EXPOSE_INIT_IMAGE: ${{ env.AGN_EXPOSE_INIT_IMAGE }}
          AGYN_AGENT_INIT_IMAGE: ${{ env.AGYN_AGENT_INIT_IMAGE }}
        with:
          service: agents_orchestrator

      - name: Restore ArgoCD sync
        if: always()
        working-directory: service
        run: devspace run restore-argocd -n platform
