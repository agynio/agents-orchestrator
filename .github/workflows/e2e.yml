name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_ref:
        description: Bootstrap ref to provision from.
        required: false
        default: e9e44b4c083bf989a664e73000ac8d9e7fda2afe
      k8s_runner_ref:
        description: k8s-runner ref to deploy from.
        required: false
        default: 974d1792c4caa2855c08e01b71fe0ec537c2a0e4

env:
  BOOTSTRAP_REF: e9e44b4c083bf989a664e73000ac8d9e7fda2afe
  K8S_RUNNER_REF: 974d1792c4caa2855c08e01b71fe0ec537c2a0e4

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@main
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_ref || env.BOOTSTRAP_REF }}

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Checkout k8s-runner
        uses: actions/checkout@v4
        with:
          repository: agynio/k8s-runner
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.k8s_runner_ref || env.K8S_RUNNER_REF }}
          path: .e2e-deps/k8s-runner

      - name: Deploy k8s-runner from source
        working-directory: .e2e-deps/k8s-runner
        run: devspace run deploy

      - name: Allow workload Ziti egress
        run: |-
          set -euo pipefail
          ziti_dns_ip="$(kubectl get service ziti-workload-dns -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "ziti-workload-dns ClusterIP is empty" >&2
            exit 1
          fi
          ziti_dns_endpoint_ip="$(kubectl get endpoints ziti-workload-dns -n ziti -o jsonpath='{.subsets[0].addresses[0].ip}')"
          if [ -z "${ziti_dns_endpoint_ip}" ]; then
            echo "ziti-workload-dns endpoint IP is empty" >&2
            exit 1
          fi
          ziti_controller_ip="$(kubectl get service ziti-controller-client -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_controller_ip}" ]; then
            echo "ziti-controller-client ClusterIP is empty" >&2
            exit 1
          fi
          ziti_router_ip="$(kubectl get service ziti-router-edge -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_router_ip}" ]; then
            echo "ziti-router-edge ClusterIP is empty" >&2
            exit 1
          fi
          istio_gateway_ip="$(kubectl get service istio-ingressgateway -n istio-gateway -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${istio_gateway_ip}" ]; then
            echo "istio-ingressgateway ClusterIP is empty" >&2
            exit 1
          fi
          kubectl patch networkpolicy agent-workload-egress \
            -n agyn-workloads \
            --type=json \
            -p "$(cat <<EOF_PATCH
          [
            {"op":"add","path":"/spec/egress/-","value":{"to":[{"ipBlock":{"cidr":"${ziti_dns_ip}/32"}},{"ipBlock":{"cidr":"${ziti_dns_endpoint_ip}/32"}},{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"ziti"}},"podSelector":{"matchLabels":{"app.kubernetes.io/name":"ziti-workload-dns"}}}],"ports":[{"protocol":"UDP","port":53},{"protocol":"TCP","port":53}]}},
            {"op":"add","path":"/spec/egress/-","value":{"to":[{"ipBlock":{"cidr":"${ziti_controller_ip}/32"}}],"ports":[{"protocol":"TCP","port":2496}]}},
            {"op":"add","path":"/spec/egress/-","value":{"to":[{"ipBlock":{"cidr":"${ziti_router_ip}/32"}}],"ports":[{"protocol":"TCP","port":2496}]}},
            {"op":"add","path":"/spec/egress/-","value":{"to":[{"ipBlock":{"cidr":"${istio_gateway_ip}/32"}}],"ports":[{"protocol":"TCP","port":443}]}}
          ]
          EOF_PATCH
          )"
          kubectl wait deployment/ziti-workload-dns -n ziti --for=condition=Available --timeout=180s
          kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml
          kubectl get service,endpoints,pods -n ziti -l app.kubernetes.io/name=ziti-workload-dns -o wide

      - name: Verify workload Ziti DNS
        run: |-
          set -euo pipefail
          ziti_dns_ip="$(kubectl get service ziti-workload-dns -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "ziti-workload-dns ClusterIP is empty" >&2
            exit 1
          fi
          kubectl delete pod ziti-dns-preflight -n agyn-workloads --ignore-not-found
          kubectl run ziti-dns-preflight \
            -n agyn-workloads \
            --image=busybox:1.37.0 \
            --restart=Never \
            --labels=agyn.dev/managed-by=agents-orchestrator \
            --command -- sh -c "timeout 30 nslookup ziti.agyn.dev ${ziti_dns_ip} && timeout 30 nslookup ziti-router.agyn.dev ${ziti_dns_ip}"
          if ! kubectl wait pod/ziti-dns-preflight -n agyn-workloads --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            kubectl get pod ziti-dns-preflight -n agyn-workloads -o yaml >&2 || true
            kubectl logs pod/ziti-dns-preflight -n agyn-workloads >&2 || true
            exit 1
          fi
          kubectl logs pod/ziti-dns-preflight -n agyn-workloads
          kubectl delete pod ziti-dns-preflight -n agyn-workloads --wait=false

      - name: Deploy orchestrator from source
        run: devspace run deploy

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        env:
          E2E_SUITES: go-core playwright-chat-app
        with:
          service: agents_orchestrator
          include_smoke: "false"

      - name: Restore k8s-runner ArgoCD sync
        if: always()
        working-directory: .e2e-deps/k8s-runner
        run: devspace run restore-argocd

      - name: Restore ArgoCD sync
        if: always()
        run: devspace run restore-argocd
