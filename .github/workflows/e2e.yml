name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_ref:
        description: Bootstrap ref to provision from.
        required: false
        default: 16fe4f32ed40d193047a13ad051d91af5f49962b
      k8s_runner_ref:
        description: k8s-runner ref to deploy from.
        required: false
        default: 74e00e9d56ae1fe5d21b7e29b7cf704522cfe3bd

env:
  BOOTSTRAP_REF: 16fe4f32ed40d193047a13ad051d91af5f49962b
  K8S_RUNNER_REF: 74e00e9d56ae1fe5d21b7e29b7cf704522cfe3bd

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@16fe4f32ed40d193047a13ad051d91af5f49962b
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_ref || env.BOOTSTRAP_REF }}

      - name: Disable workload Ziti OIDC API
        run: |-
          set -euo pipefail
          kubectl get configmap ziti-controller-config -n ziti -o jsonpath='{.data.ziti-controller\.yaml}' > /tmp/ziti-controller.yaml
          awk '
            function indent_len(line) {
              match(line, /^[ ]*/)
              return RLENGTH
            }
            function skip_oidc_block(current_indent) {
              return skip_oidc && current_indent > oidc_indent
            }
            {
              current_indent = indent_len($0)
              if (skip_oidc && skip_oidc_block(current_indent)) {
                next
              }
              skip_oidc = 0
              if ($0 ~ /^[ ]*- binding: edge-oidc[ ]*$/) {
                skip_oidc = 1
                oidc_indent = current_indent
                next
              }

              if ($0 ~ /^[ ]*edge:[ ]*$/) {
                in_edge = 1
                edge_indent = current_indent
                in_edge_api = 0
              } else if (in_edge && current_indent <= edge_indent && $0 !~ /^[ ]*$/) {
                in_edge = 0
                in_edge_api = 0
              }

              if (in_edge && $0 ~ /^[ ]*api:[ ]*$/) {
                in_edge_api = 1
                edge_api_indent = current_indent
                print
                printf "%*sdisableOidcAutoBinding: \"true\"\n", edge_api_indent + 2, ""
                next
              } else if (in_edge_api && current_indent <= edge_api_indent && $0 !~ /^[ ]*$/) {
                in_edge_api = 0
              }

              if (!(in_edge_api && $0 ~ /^[ ]*disableOidcAutoBinding:/)) {
                print
              }
            }
          ' /tmp/ziti-controller.yaml > /tmp/ziti-controller-no-oidc.yaml
          if ! grep -q "disableOidcAutoBinding: \"true\"" /tmp/ziti-controller-no-oidc.yaml; then
            echo "expected disableOidcAutoBinding in patched Ziti controller config" >&2
            exit 1
          fi
          if grep -q "edge-oidc" /tmp/ziti-controller-no-oidc.yaml; then
            echo "expected patched Ziti controller config to remove edge-oidc bindings" >&2
            grep -n "edge-oidc" /tmp/ziti-controller-no-oidc.yaml >&2
            exit 1
          fi
          grep -n -A4 -B2 "disableOidcAutoBinding" /tmp/ziti-controller-no-oidc.yaml
          kubectl create configmap ziti-controller-config -n ziti \
            --from-file=ziti-controller.yaml=/tmp/ziti-controller-no-oidc.yaml \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl rollout restart deployment/ziti-controller -n ziti
          kubectl rollout status deployment/ziti-controller -n ziti --timeout=300s
          version_json=""
          for attempt in $(seq 1 30); do
            if version_json="$(kubectl exec -n ziti deployment/ziti-controller -- curl --insecure --fail --show-error --silent https://127.0.0.1:1280/edge/client/v1/version)"; then
              break
            fi
            echo "waiting for Ziti controller client API after OIDC patch (${attempt}/30)" >&2
            sleep 2
          done
          if [ -z "${version_json}" ]; then
            echo "Ziti controller client API did not become reachable after OIDC patch" >&2
            kubectl get pods -n ziti -l app.kubernetes.io/name=ziti-controller -o wide >&2 || true
            kubectl logs -n ziti deployment/ziti-controller --all-containers --tail=200 >&2 || true
            exit 1
          fi
          echo "${version_json}"
          if echo "${version_json}" | grep -q OIDC_AUTH; then
            echo "Ziti OIDC capability still advertised after removing edge-oidc bindings" >&2
            exit 1
          fi

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Checkout k8s-runner
        uses: actions/checkout@v4
        with:
          repository: agynio/k8s-runner
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.k8s_runner_ref || env.K8S_RUNNER_REF }}
          path: .e2e-deps/k8s-runner

      - name: Deploy k8s-runner from source
        working-directory: .e2e-deps/k8s-runner
        run: devspace run deploy

      - name: Allow workload Ziti egress
        run: |-
          set -euo pipefail
          ziti_dns_ip="$(kubectl get service ziti-workload-dns -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "ziti-workload-dns ClusterIP is empty" >&2
            exit 1
          fi
          ziti_dns_endpoint_ip="$(kubectl get endpoints ziti-workload-dns -n ziti -o jsonpath='{.subsets[0].addresses[0].ip}')"
          if [ -z "${ziti_dns_endpoint_ip}" ]; then
            echo "ziti-workload-dns endpoint IP is empty" >&2
            exit 1
          fi
          ziti_controller_ip="$(kubectl get service ziti-controller-client -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_controller_ip}" ]; then
            echo "ziti-controller-client ClusterIP is empty" >&2
            exit 1
          fi
          ziti_router_ip="$(kubectl get service ziti-router-edge -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_router_ip}" ]; then
            echo "ziti-router-edge ClusterIP is empty" >&2
            exit 1
          fi
          istio_gateway_ip="$(kubectl get service istio-ingressgateway -n istio-gateway -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${istio_gateway_ip}" ]; then
            echo "istio-ingressgateway ClusterIP is empty" >&2
            exit 1
          fi
          kubectl patch networkpolicy ziti-workload-dns \
            -n ziti \
            --type=json \
            -p '[{"op":"add","path":"/spec/ingress/-","value":{"from":[{"ipBlock":{"cidr":"10.42.0.0/16"}}],"ports":[{"protocol":"UDP","port":53},{"protocol":"TCP","port":53}]}}]'
          kubectl patch networkpolicy agent-workload-egress \
            -n agyn-workloads \
            --type=json \
            -p "$(cat <<EOF_PATCH
          [
            {"op":"add","path":"/spec/egress/-","value":{"to":[{"ipBlock":{"cidr":"${ziti_dns_ip}/32"}},{"ipBlock":{"cidr":"${ziti_dns_endpoint_ip}/32"}},{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"ziti"}},"podSelector":{"matchLabels":{"app.kubernetes.io/name":"ziti-workload-dns"}}}],"ports":[{"protocol":"UDP","port":53},{"protocol":"TCP","port":53}]}},
            {"op":"add","path":"/spec/egress/-","value":{"to":[{"ipBlock":{"cidr":"${ziti_controller_ip}/32"}}],"ports":[{"protocol":"TCP","port":2496}]}},
            {"op":"add","path":"/spec/egress/-","value":{"to":[{"ipBlock":{"cidr":"${ziti_router_ip}/32"}}],"ports":[{"protocol":"TCP","port":2496}]}},
            {"op":"add","path":"/spec/egress/-","value":{"to":[{"ipBlock":{"cidr":"${istio_gateway_ip}/32"}},{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"istio-gateway"}},"podSelector":{"matchLabels":{"app":"istio-ingressgateway"}}}],"ports":[{"protocol":"TCP","port":443}]}}
          ]
          EOF_PATCH
          )"
          kubectl wait deployment/ziti-workload-dns -n ziti --for=condition=Available --timeout=180s
          kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml
          kubectl get networkpolicy ziti-workload-dns -n ziti -o yaml
          kubectl get service,endpoints,pods -n ziti -l app.kubernetes.io/name=ziti-workload-dns -o wide

      - name: Verify workload Ziti DNS
        run: |-
          set -euo pipefail
          ziti_dns_ip="$(kubectl get service ziti-workload-dns -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "ziti-workload-dns ClusterIP is empty" >&2
            exit 1
          fi
          kubectl delete pod ziti-dns-preflight -n agyn-workloads --ignore-not-found
          cat <<EOF_POD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ziti-dns-preflight
            namespace: agyn-workloads
            labels:
              agyn.dev/managed-by: agents-orchestrator
          spec:
            restartPolicy: Never
            containers:
              - name: ziti-dns-preflight
                image: busybox:1.37.0
                command:
                  - sh
                  - -c
                  - timeout 30 nslookup ziti.agyn.dev ${ziti_dns_ip} && timeout 30 nslookup ziti-router.agyn.dev ${ziti_dns_ip}
          EOF_POD
          if ! kubectl wait pod/ziti-dns-preflight -n agyn-workloads --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            kubectl get pod ziti-dns-preflight -n agyn-workloads -o yaml >&2 || true
            kubectl logs pod/ziti-dns-preflight -n agyn-workloads >&2 || true
            exit 1
          fi
          kubectl logs pod/ziti-dns-preflight -n agyn-workloads
          kubectl delete pod ziti-dns-preflight -n agyn-workloads --wait=false

      - name: Verify workload Ziti runtime TCP
        run: |-
          set -euo pipefail
          ziti_dns_ip="$(kubectl get service ziti-workload-dns -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "ziti-workload-dns ClusterIP is empty" >&2
            exit 1
          fi
          kubectl delete pod ziti-runtime-preflight -n agyn-workloads --ignore-not-found
          cat <<EOF_POD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ziti-runtime-preflight
            namespace: agyn-workloads
            labels:
              agyn.dev/managed-by: agents-orchestrator
          spec:
            restartPolicy: Never
            dnsPolicy: None
            dnsConfig:
              nameservers:
                - ${ziti_dns_ip}
            containers:
              - name: ziti-runtime-preflight
                image: curlimages/curl:8.16.0
                command:
                  - sh
                  - -c
                  - curl --insecure --fail --show-error --verbose --connect-timeout 10 --max-time 30 https://ziti.agyn.dev:443/edge/client/v1/version
          EOF_POD
          if ! kubectl wait pod/ziti-runtime-preflight -n agyn-workloads --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            echo "ziti runtime TCP preflight failed with selector-aware ingressgateway policy present" >&2
            kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml >&2 || true
            kubectl get service,endpoints,pods -n istio-gateway -l app=istio-ingressgateway -o wide >&2 || true
            kubectl get pod ziti-runtime-preflight -n agyn-workloads -o yaml >&2 || true
            kubectl logs pod/ziti-runtime-preflight -n agyn-workloads >&2 || true
            exit 1
          fi
          kubectl logs pod/ziti-runtime-preflight -n agyn-workloads
          kubectl delete pod ziti-runtime-preflight -n agyn-workloads --wait=false

      - name: Deploy orchestrator from source
        run: devspace run deploy

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        env:
          E2E_SUITES: go-core playwright-chat-app
        with:
          service: agents_orchestrator
          include_smoke: "false"

      - name: Restore k8s-runner ArgoCD sync
        if: ${{ always() && hashFiles('.e2e-deps/k8s-runner/devspace.yaml') != '' }}
        working-directory: .e2e-deps/k8s-runner
        run: devspace run restore-argocd

      - name: Restore ArgoCD sync
        if: always()
        run: devspace run restore-argocd
