name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bootstrap_ref:
        description: Bootstrap ref to provision from.
        required: false
        default: 5f40b33b21abd09e2e98ce95a3e6d2cccf12b52b
      k8s_runner_ref:
        description: k8s-runner ref to deploy from.
        required: false
        default: b83f170169c3baf0588e7ec56fe1f365e62e5670

env:
  BOOTSTRAP_REF: 5f40b33b21abd09e2e98ce95a3e6d2cccf12b52b
  K8S_RUNNER_REF: b83f170169c3baf0588e7ec56fe1f365e62e5670

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@5f40b33b21abd09e2e98ce95a3e6d2cccf12b52b
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_ref || env.BOOTSTRAP_REF }}

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Checkout k8s-runner
        uses: actions/checkout@v4
        with:
          repository: agynio/k8s-runner
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.k8s_runner_ref || env.K8S_RUNNER_REF }}
          path: .e2e-deps/k8s-runner

      - name: Deploy k8s-runner from source
        working-directory: .e2e-deps/k8s-runner
        run: devspace run deploy

      - name: Allow workload Ziti egress
        run: |-
          set -euo pipefail
          service_endpoint_ips() {
            kubectl get endpoints "$1" -n "$2" -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{" "}{end}'
          }
          ziti_dns_ip="$(kubectl get service ziti-workload-dns -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "ziti-workload-dns ClusterIP is empty" >&2
            exit 1
          fi
          ziti_dns_endpoint_ips="$(service_endpoint_ips ziti-workload-dns ziti)"
          if [ -z "${ziti_dns_endpoint_ips}" ]; then
            echo "ziti-workload-dns endpoints are empty" >&2
            exit 1
          fi
          ziti_controller_ip="$(kubectl get service ziti-controller-client -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_controller_ip}" ]; then
            echo "ziti-controller-client ClusterIP is empty" >&2
            exit 1
          fi
          ziti_controller_endpoint_ips="$(service_endpoint_ips ziti-controller-client ziti)"
          if [ -z "${ziti_controller_endpoint_ips}" ]; then
            echo "ziti-controller-client endpoints are empty" >&2
            exit 1
          fi
          ziti_router_ip="$(kubectl get service ziti-router-edge -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_router_ip}" ]; then
            echo "ziti-router-edge ClusterIP is empty" >&2
            exit 1
          fi
          ziti_router_endpoint_ips="$(service_endpoint_ips ziti-router-edge ziti)"
          if [ -z "${ziti_router_endpoint_ips}" ]; then
            echo "ziti-router-edge endpoints are empty" >&2
            exit 1
          fi
          istio_gateway_ip="$(kubectl get service istio-ingressgateway -n istio-gateway -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${istio_gateway_ip}" ]; then
            echo "istio-ingressgateway ClusterIP is empty" >&2
            exit 1
          fi
          istio_gateway_endpoint_ips="$(service_endpoint_ips istio-ingressgateway istio-gateway)"
          if [ -z "${istio_gateway_endpoint_ips}" ]; then
            echo "istio-ingressgateway endpoints are empty" >&2
            exit 1
          fi

          add_tcp_egress_ip() {
            patch="${patch},{\"op\":\"add\",\"path\":\"/spec/egress/-\",\"value\":{\"to\":[{\"ipBlock\":{\"cidr\":\"$1/32\"}}],\"ports\":[{\"protocol\":\"TCP\",\"port\":$2}]}}"
          }

          patch='[{"op":"add","path":"/spec/egress/-","value":{"to":[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"ziti"}},"podSelector":{"matchLabels":{"app.kubernetes.io/name":"ziti-workload-dns"}}}],"ports":[{"protocol":"UDP","port":53},{"protocol":"TCP","port":53}]}},{"op":"add","path":"/spec/egress/-","value":{"to":[{"ipBlock":{"cidr":"'"${ziti_dns_ip}"'/32"}}],"ports":[{"protocol":"UDP","port":53},{"protocol":"TCP","port":53}]}}'
          for ziti_dns_endpoint_ip in ${ziti_dns_endpoint_ips}; do
            patch="${patch},{\"op\":\"add\",\"path\":\"/spec/egress/-\",\"value\":{\"to\":[{\"ipBlock\":{\"cidr\":\"${ziti_dns_endpoint_ip}/32\"}}],\"ports\":[{\"protocol\":\"UDP\",\"port\":53},{\"protocol\":\"TCP\",\"port\":53}]}}"
          done
          add_tcp_egress_ip "${istio_gateway_ip}" 443
          for istio_gateway_endpoint_ip in ${istio_gateway_endpoint_ips}; do
            add_tcp_egress_ip "${istio_gateway_endpoint_ip}" 443
          done
          add_tcp_egress_ip "${ziti_controller_ip}" 2496
          for ziti_controller_endpoint_ip in ${ziti_controller_endpoint_ips}; do
            add_tcp_egress_ip "${ziti_controller_endpoint_ip}" 2496
            add_tcp_egress_ip "${ziti_controller_endpoint_ip}" 1280
          done
          add_tcp_egress_ip "${ziti_router_ip}" 2496
          for ziti_router_endpoint_ip in ${ziti_router_endpoint_ips}; do
            add_tcp_egress_ip "${ziti_router_endpoint_ip}" 2496
            add_tcp_egress_ip "${ziti_router_endpoint_ip}" 3022
          done
          patch="${patch}]"

          kubectl patch networkpolicy agent-workload-egress \
            -n agyn-workloads \
            --type=json \
            -p "${patch}"
          kubectl patch networkpolicy ziti-workload-dns \
            -n ziti \
            --type=json \
            -p '[{"op":"add","path":"/spec/ingress/-","value":{"ports":[{"protocol":"UDP","port":53},{"protocol":"TCP","port":53}]}}]'
          kubectl wait deployment/ziti-workload-dns -n ziti --for=condition=Available --timeout=180s
          kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml
          kubectl get networkpolicy ziti-workload-dns -n ziti -o yaml
          kubectl get service,endpoints,pods -n ziti -l app.kubernetes.io/name=ziti-workload-dns -o wide

      - name: Verify workload Ziti DNS
        run: |-
          set -euo pipefail
          dump_ziti_dns_preflight_diagnostics() {
            kubectl get pod ziti-dns-preflight -n agyn-workloads -o wide || true
            kubectl describe pod ziti-dns-preflight -n agyn-workloads || true
            kubectl logs pod/ziti-dns-preflight -n agyn-workloads --all-containers=true --tail=-1 || true
            kubectl get configmap ziti-workload-dns -n ziti -o yaml || true
            kubectl get service,endpoints,pods -n ziti -l app.kubernetes.io/name=ziti-workload-dns -o wide || true
            kubectl get service,endpoints -n ziti ziti-workload-dns ziti-controller-client ziti-router-edge -o wide || true
            kubectl get service,endpoints -n istio-gateway istio-ingressgateway -o wide || true
            kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml || true
            kubectl get networkpolicy ziti-workload-dns -n ziti -o yaml || true
            kubectl get pods -n agyn-workloads -o wide || true
            kubectl logs -n agyn-workloads -l app.kubernetes.io/name=ziti-sidecar --all-containers --tail=200 || true
            kubectl logs -n agyn-workloads -l agyn.dev/component=ziti-sidecar --all-containers --tail=200 || true
          }
          ziti_dns_ip="$(kubectl get service ziti-workload-dns -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "ziti-workload-dns ClusterIP is empty" >&2
            dump_ziti_dns_preflight_diagnostics
            exit 1
          fi
          ziti_dns_endpoint_ip="$(kubectl get endpoints ziti-workload-dns -n ziti -o jsonpath='{.subsets[0].addresses[0].ip}')"
          if [ -z "${ziti_dns_endpoint_ip}" ]; then
            echo "ziti-workload-dns endpoint IP is empty" >&2
            dump_ziti_dns_preflight_diagnostics
            exit 1
          fi
          echo "ziti-workload-dns service ClusterIP: ${ziti_dns_ip}"
          echo "ziti-workload-dns first endpoint IP: ${ziti_dns_endpoint_ip}"
          kubectl get service,endpoints,pods -n ziti -l app.kubernetes.io/name=ziti-workload-dns -o wide
          kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml
          kubectl delete pod ziti-dns-preflight -n agyn-workloads --ignore-not-found
          cat <<EOF_POD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ziti-dns-preflight
            namespace: agyn-workloads
            labels:
              agyn.dev/managed-by: agents-orchestrator
          spec:
            restartPolicy: Never
            containers:
              - name: ziti-dns-preflight
                image: busybox:1.37.0
                env:
                  - name: ZITI_DNS_SERVICE_IP
                    value: "${ziti_dns_ip}"
                  - name: ZITI_DNS_ENDPOINT_IP
                    value: "${ziti_dns_endpoint_ip}"
                command:
                  - sh
                  - -c
                  - |-
                    set -eu
                    run_lookup() {
                      host="\${1}"
                      server_name="\${2}"
                      server_ip="\${3}"
                      echo "== nslookup \${host} via \${server_name} \${server_ip} =="
                      timeout 30 nslookup "\${host}" "\${server_ip}"
                    }
                    run_lookup ziti.agyn.dev service-cluster-ip "\${ZITI_DNS_SERVICE_IP}"
                    run_lookup ziti-router.agyn.dev service-cluster-ip "\${ZITI_DNS_SERVICE_IP}"
                    run_lookup ziti.agyn.dev endpoint-pod-ip "\${ZITI_DNS_ENDPOINT_IP}"
                    run_lookup ziti-router.agyn.dev endpoint-pod-ip "\${ZITI_DNS_ENDPOINT_IP}"
                    echo "== tcp connect to service-cluster-ip \${ZITI_DNS_SERVICE_IP}:53 =="
                    timeout 10 nc -vz -w 5 "\${ZITI_DNS_SERVICE_IP}" 53
                    echo "== tcp connect to endpoint-pod-ip \${ZITI_DNS_ENDPOINT_IP}:53 =="
                    timeout 10 nc -vz -w 5 "\${ZITI_DNS_ENDPOINT_IP}" 53
          EOF_POD
          if ! kubectl wait pod/ziti-dns-preflight -n agyn-workloads --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            echo "ziti-workload-dns UDP/TCP 53 preflight failed from agyn-workloads" >&2
            kubectl get pod ziti-dns-preflight -n agyn-workloads -o yaml >&2 || true
            kubectl logs pod/ziti-dns-preflight -n agyn-workloads >&2 || true
            dump_ziti_dns_preflight_diagnostics >&2
            exit 1
          fi
          kubectl logs pod/ziti-dns-preflight -n agyn-workloads
          kubectl delete pod ziti-dns-preflight -n agyn-workloads --wait=false

      - name: Verify workload Ziti runtime TCP
        run: |-
          set -euo pipefail
          ziti_dns_ip="$(kubectl get service ziti-workload-dns -n ziti -o jsonpath='{.spec.clusterIP}')"
          if [ -z "${ziti_dns_ip}" ]; then
            echo "ziti-workload-dns ClusterIP is empty" >&2
            exit 1
          fi
          kubectl delete pod ziti-runtime-preflight -n agyn-workloads --ignore-not-found
          cat <<EOF_POD | kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: ziti-runtime-preflight
            namespace: agyn-workloads
            labels:
              agyn.dev/managed-by: agents-orchestrator
          spec:
            restartPolicy: Never
            dnsPolicy: None
            dnsConfig:
              nameservers:
                - ${ziti_dns_ip}
            containers:
              - name: ziti-runtime-preflight
                image: curlimages/curl:8.16.0
                command:
                  - sh
                  - -c
                  - curl --insecure --fail --show-error --verbose --connect-timeout 10 --max-time 30 https://ziti.agyn.dev:443/edge/client/v1/version
          EOF_POD
          if ! kubectl wait pod/ziti-runtime-preflight -n agyn-workloads --for=jsonpath='{.status.phase}'=Succeeded --timeout=120s; then
            echo "ziti runtime TCP preflight failed with selector-aware ingressgateway policy present" >&2
            kubectl get networkpolicy agent-workload-egress -n agyn-workloads -o yaml >&2 || true
            kubectl get service,endpoints,pods -n istio-gateway -l app=istio-ingressgateway -o wide >&2 || true
            kubectl get service,endpoints,pods -n ziti -l app.kubernetes.io/name=ziti-workload-dns -o wide >&2 || true
            kubectl get pod ziti-runtime-preflight -n agyn-workloads -o yaml >&2 || true
            kubectl logs pod/ziti-runtime-preflight -n agyn-workloads >&2 || true
            exit 1
          fi
          kubectl logs pod/ziti-runtime-preflight -n agyn-workloads
          kubectl delete pod ziti-runtime-preflight -n agyn-workloads --wait=false

      - name: Deploy orchestrator from source
        run: devspace run deploy

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        env:
          E2E_SUITES: go-core playwright-chat-app
        with:
          service: agents_orchestrator
          include_smoke: "false"

      - name: Restore k8s-runner ArgoCD sync
        if: ${{ always() && hashFiles('.e2e-deps/k8s-runner/devspace.yaml') != '' }}
        working-directory: .e2e-deps/k8s-runner
        run: devspace run restore-argocd

      - name: Restore ArgoCD sync
        if: always()
        run: devspace run restore-argocd
