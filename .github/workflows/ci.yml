name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      - name: Generate protobuf bindings
        run: |
          buf generate buf.build/agynio/api \
            --include-imports \
            --path agynio/api/runner/v1 \
            --path agynio/api/runners/v1 \
            --path agynio/api/threads/v1 \
            --path agynio/api/notifications/v1 \
            --path agynio/api/metering/v1 \
            --path agynio/api/agents/v1 \
            --path agynio/api/secrets/v1 \
            --path agynio/api/ziti_management/v1 \
            --path agynio/api/groups/v1 \
            --path agynio/api/identity/v1 \
            --path agynio/api/llm/v1 \
            --path agynio/api/users/v1 \
            --path agynio/api/organizations/v1 \
            --path agynio/api/tracing/v1

      - name: Run tests
        run: go test ./...

      - name: Build
        run: go build ./...

  ziti-tunnel-image:
    name: Build Ziti tunnel image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Ziti tunnel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/ziti-tunnel-x509/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/agynio/agents-orchestrator:ziti-tunnel-ci
